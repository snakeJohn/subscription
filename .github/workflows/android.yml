name: Android

on:
  push:
    branches: [main, master]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew 的执行位可能在 Windows 上创建时丢失，兜底补上
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      # 从 Secret 解出固定签名密钥（仅 push 到 main；PR/手动触发无此步，release 回退 debug 签名）
      - name: Decode release keystore
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          SUBSTAT_KEYSTORE: ${{ steps.keystore.outputs.path }}
          SUBSTAT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SUBSTAT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SUBSTAT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: substat-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: substat-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/

      # main 分支每次构建成功都滚动更新「latest」Release，
      # 无需登录 GitHub 也能直接下载 APK（Artifacts 需要登录且会过期）
      - name: Read version + generate update manifest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: ver
        run: |
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "v=$VN" >> "$GITHUB_OUTPUT"
          NOTES=$(git log -1 --pretty=%s)
          APK="https://github.com/${{ github.repository }}/releases/download/android-latest/app-release.apk"
          jq -n --argjson vc "$VC" --arg vn "$VN" --arg url "$APK" \
                --arg notes "$NOTES" --arg sha "${{ github.sha }}" \
            '{versionCode:$vc, versionName:$vn, apkUrl:$url, notes:$notes, sha:$sha}' > latest.json
          echo "生成的 latest.json："; cat latest.json

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "SubStat Android v${{ steps.ver.outputs.v }}"
          body: |
            主分支最新构建，App 内可自动更新。
            - `app-release.apk` — R8 压缩、固定签名，日常安装用这个
            - `app-debug.apk` — 调试版，包名带 `.debug` 后缀，可与正式版共存
            - `latest.json` — 版本清单，供 App 检查更新
            构建于 commit ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/latest.json
