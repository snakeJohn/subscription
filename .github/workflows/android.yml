name: Android

on:
  push:
    branches: [main, master]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew 的执行位可能在 Windows 上创建时丢失，兜底补上
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: substat-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: substat-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/

      # main 分支每次构建成功都滚动更新「latest」Release，
      # 无需登录 GitHub 也能直接下载 APK（Artifacts 需要登录且会过期）
      - name: Read versionName
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: ver
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "SubStat Android v${{ steps.ver.outputs.v }}"
          body: |
            主分支最新构建（自动更新）。
            - `app-release.apk` — R8 压缩版，日常安装用这个（debug 签名，可直接安装）
            - `app-debug.apk` — 调试版，包名带 `.debug` 后缀，可与正式版共存
            构建于 commit ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
