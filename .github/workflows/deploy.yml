name: Deploy

on:
  push:
    branches: [main]
    paths: ['worker/**', 'public/**', 'wrangler.toml', 'schema.sql', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 仓库里的 wrangler.toml 是脱敏模板，真实资源 ID 存在 GitHub Secrets，
    # 部署前动态填入，生成 wrangler.ci.toml
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: 未配置 token 时跳过
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::未设置 CLOUDFLARE_API_TOKEN，跳过部署。执行 gh secret set CLOUDFLARE_API_TOKEN 后重跑即可。"

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'

      - name: 生成部署配置
        if: env.HAS_TOKEN == 'true'
        run: |
          sed -e "s/YOUR_ACCOUNT_ID/${{ secrets.CF_ACCOUNT_ID }}/" \
              -e "s/YOUR_D1_DATABASE_ID/${{ secrets.CF_D1_DATABASE_ID }}/" \
              -e "s/YOUR_KV_NAMESPACE_ID/${{ secrets.CF_KV_NAMESPACE_ID }}/" \
              wrangler.toml > wrangler.ci.toml
          # 自定义域名已持久绑定在 Worker 上，无需每次重写 routes；
          # 删掉后 token 也不需要 Zone 级权限（见 README「关于自定义域名与 token 权限」）
          sed -i '/^routes = \[/,/^\]/d' wrangler.ci.toml

      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_TOKEN == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.110.0'
          command: deploy --config wrangler.ci.toml
